---
name: "Build Self-Hosted Image"

# Builds the deploy image from the `self-hosted` branch and publishes it to
# ghcr.io/bradykirk/postiz-app:latest (+ a self-hosted-<sha> tag).
# Coolify pulls :latest, so a push to self-hosted -> new image -> redeploy.

on:
  workflow_dispatch:
  push:
    branches:
      - self-hosted

concurrency:
  group: build-self-hosted
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        env:
          NEXT_PUBLIC_VERSION: self-hosted-${{ steps.vars.outputs.sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ghcr.io/bradykirk/postiz-app:latest \
            -t ghcr.io/bradykirk/postiz-app:self-hosted-${{ steps.vars.outputs.sha }} \
            --build-arg NEXT_PUBLIC_VERSION=${{ env.NEXT_PUBLIC_VERSION }} \
            --pull \
            --no-cache \
            --provenance=false --sbom=false \
            --output "type=registry" .

      - name: Verify pushed image
        run: docker buildx imagetools inspect ghcr.io/bradykirk/postiz-app:latest
